version: "3.9"

# Opcional: um MySQL local pra desenvolver sem mexer no banco de produção do
# EasyPanel. Sobe só o banco — a API roda localmente (pnpm dev:api) apontando
# pra cá. Em produção, use o MySQL do EasyPanel (ver docs/DEPLOY_EASYPANEL.md).
services:
  mysql:
    image: mysql:8.4
    container_name: salao-saas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: salao_root_dev
      MYSQL_DATABASE: salao_saas
      MYSQL_USER: salao
      MYSQL_PASSWORD: salao_dev
    ports:
      - "3306:3306"
    volumes:
      - salao_mysql_data:/var/lib/mysql

volumes:
  salao_mysql_data:
